# Reusable: validate Packer templates on a PR; on a push to main, once
# approved, rebuild the affected ones and every template cloning them. VMs are
# full clones: none changes until it is rebuilt with its `rebuild` counter.
# The caller provides scripts/packer <name> <args>. Its build goes to
# <name>-next, at the template's VMID + 50, and replaces the old template
# only once it has succeeded: a build that fails or is cut leaves the old one
# where it was.
name: packer

on:
  workflow_call:
    inputs:
      templates-dir:
        description: Directory holding one Packer template per subdirectory, relative to the repo root.
        type: string
        default: packer
      build-order:
        description: File listing the templates to build, one per line, each after the one it clones.
        type: string
        default: packer/build-order
      roles-dir:
        description: Directory of the Ansible roles the templates' playbook.yml bake, relative to the repo root.
        type: string
        default: ansible/roles
      environment:
        description: Environment whose reviewers must approve a rebuild.
        type: string
        default: production
      tools:
        description: mise tools the build installs. Only these — a broken, unrelated tool in the repo's mise.toml must not block a build.
        type: string
        default: packer jq uv ansible
      runs-on:
        description: >-
          Where the build runs, as JSON. Defaults to the self-hosted runners on
          the CI VMs: the build VM is reached over SSH inside the network.
        type: string
        default: '{"group": "0xc0", "labels": "0xc0"}'
      vault-addr:
        description: Vault's address. Empty, the job does not log in to Vault.
        type: string
        default: ""
      vault-role:
        description: Vault JWT auth role the job logs in with, through GitHub's OIDC token. Required with vault-addr.
        type: string
        default: ""
      vault-secrets:
        description: >-
          The secrets the job reads from Vault once logged in, in
          hashicorp/vault-action's format ("<path> <key> | <ENV_VAR>;" per
          line): each lands in the job's environment, masked. Every secret
          the build needs comes from here.
        type: string
        default: ""

# id-token: for the Vault login; the caller grants it even without Vault.
permissions:
  contents: read
  id-token: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      TEMPLATES_DIR: ${{ inputs.templates-dir }}
      # packer init uses the GitHub API: unauthenticated, it is rate limited.
      PACKER_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: packer

      - name: validate
        env:
          # validate checks the variables' presence, not their values.
          PKR_VAR_proxmox_url: https://example.invalid/api2/json
          PKR_VAR_proxmox_username: validate@pve!validate
          PKR_VAR_proxmox_token: validate
        run: |
          packer fmt -check -recursive "$TEMPLATES_DIR"
          for t in "$TEMPLATES_DIR"/*/; do
            packer init "$t"
            packer validate "$t"
          done

  # A change outside a template's directory and the roles rebuilds them all.
  select:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      chains: ${{ steps.select.outputs.chains }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: select
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          TEMPLATES_DIR: ${{ inputs.templates-dir }}
          ROLES_DIR: ${{ inputs.roles-dir }}
          BUILD_ORDER: ${{ inputs.build-order }}
        run: |
          all=1
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "${BEFORE//0/}" != "" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"; all=0
          fi
          mapfile -t order < <(grep -vE '^(#|$)' "$BUILD_ORDER")
          declare -A hit=()
          while IFS= read -r f; do
            [ "$all" = 0 ] || break
            [ -n "$f" ] || continue
            case "$f" in
              "$TEMPLATES_DIR"/*/*)
                t="${f#"$TEMPLATES_DIR"/}"; hit["${t%%/*}"]=1 ;;
              "$ROLES_DIR"/*/*)
                role="${f#"$ROLES_DIR"/}"; role="${role%%/*}"
                for t in "${order[@]}"; do
                  if grep -Eq "^[[:space:]-]*(role|name):[[:space:]]*[\"']?${role}[\"']?[[:space:]]*$" "$TEMPLATES_DIR/$t/playbook.yml"; then hit["$t"]=1; fi
                done ;;
              *) all=1 ;;
            esac
          done <<< "${changed:-}"
          # The build order lists each template after the one it clones, so one
          # pass finds every clone of a rebuilt template, and its chain's root.
          declare -A root=() chain=()
          roots=()
          for t in "${order[@]}"; do
            src="$(sed -nE 's/^[[:space:]]*clone_vm[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$TEMPLATES_DIR/$t"/*.pkr.hcl | head -n1)"
            if [ -n "$src" ] && [ -n "${hit[$src]:-}" ]; then hit["$t"]=1; fi
            if [ -n "$src" ] && [ -n "${root[$src]:-}" ]; then root["$t"]="${root[$src]}"; else root["$t"]="$t"; fi
            if [ "$all" = 1 ] || [ -n "${hit[$t]:-}" ]; then
              r="${root[$t]}"
              if [ -z "${chain[$r]:-}" ]; then roots+=("$r"); fi
              chain["$r"]="${chain[$r]:+${chain[$r]} }$t"
            fi
          done
          if [ "${#roots[@]}" = 0 ]; then echo "No template is affected by this change."; fi
          json='[]'
          for r in "${roots[@]}"; do
            echo "Rebuilds, in order: ${chain[$r]}"
            json="$(jq -c --arg r "$r" --arg t "${chain[$r]}" '. + [{root: $r, templates: $t}]' <<< "$json")"
          done
          echo "chains=$json" >> "$GITHUB_OUTPUT"

  # Only a push runs it, so a fork's PR never reaches the network. Chains run
  # in parallel: each needs its own build address (build_ip).
  build:
    needs: select
    if: github.event_name == 'push' && needs.select.outputs.chains != '[]'
    strategy:
      fail-fast: false
      matrix:
        chain: ${{ fromJSON(needs.select.outputs.chains) }}
    name: build (${{ matrix.chain.root }})
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    environment: ${{ inputs.environment }}
    timeout-minutes: 60
    # Cancelling a build leaves a half-built VM behind.
    concurrency:
      group: packer-${{ github.repository }}-${{ matrix.chain.root }}
      cancel-in-progress: false
    env:
      TEMPLATES: ${{ matrix.chain.templates }}
      VAULT_ADDR: ${{ inputs.vault-addr }}
      # packer init uses the GitHub API: unauthenticated, it is rate limited.
      PACKER_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: ${{ inputs.tools }}

      # Packer's plugins live in GitHub's cache between builds: the runner's
      # home is emptied around every job, and without it each build would
      # download them again from GitHub's releases. They go under RUNNER_TEMP,
      # which the runner empties too. The key is the templates'
      # required_plugins blocks alone, braces counted, so a bump changes it
      # by itself and any other edit keeps it.
      - name: plugins key
        id: plugins-key
        env:
          TEMPLATES_DIR: ${{ inputs.templates-dir }}
        run: |
          echo "PACKER_PLUGIN_PATH=$RUNNER_TEMP/packer-plugins" >> "$GITHUB_ENV"
          hash=$(awk '/required_plugins[[:space:]]*\{/ { on = 1; depth = 0 }
                      on { print; depth += gsub(/\{/, "{") - gsub(/\}/, "}"); if (depth == 0) on = 0 }' \
                   "$TEMPLATES_DIR"/*/*.pkr.hcl | sha256sum | cut -d' ' -f1)
          echo "key=packer-plugins-$RUNNER_OS-$RUNNER_ARCH-$hash" >> "$GITHUB_OUTPUT"

      - name: plugins
        id: plugins
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/packer-plugins
          key: ${{ steps.plugins-key.outputs.key }}

      # JWT login with the job's OIDC token: no Vault credential is stored.
      - name: vault
        if: inputs.vault-addr != ''
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ inputs.vault-addr }}
          method: jwt
          path: jwt
          role: ${{ inputs.vault-role }}
          jwtGithubAudience: ${{ inputs.vault-addr }}
          exportToken: true
          secrets: ${{ inputs.vault-secrets }}

      # scripts/packer passes only the token's secret half, so mask it alone.
      - name: mask
        if: inputs.vault-addr != ''
        run: |
          if [ -n "${PROXMOX_VE_API_TOKEN:-}" ]; then echo "::add-mask::${PROXMOX_VE_API_TOKEN#*=}"; fi

      # Every template of the chain, before any is built. A transient error
      # from GitHub's releases must not fail the build: each init is tried up
      # to three times, 15 s and then 45 s apart, and fails after the last.
      - name: init
        run: |
          # Not while-read: a command reading stdin would eat the list.
          for name in $TEMPLATES; do
            for pause in 15 45 last; do
              if scripts/packer "$name" init; then break; fi
              if [ "$pause" = last ]; then
                echo "::error::packer init of $name failed three times."
                exit 1
              fi
              echo "::warning::packer init of $name failed; trying again in ${pause}s."
              sleep "$pause"
            done
          done

      # Saved as soon as init has them, whatever the build does next.
      - name: save plugins
        if: steps.plugins.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/packer-plugins
          key: ${{ steps.plugins-key.outputs.key }}

      # Each template is built beside the old one, as <name>-next at its VMID
      # + 50, and replaces it only once the build has succeeded.
      - name: build
        run: |
          for name in $TEMPLATES; do
            echo "::group::$name"
            scripts/packer "$name" build -color=false -var "commit=${GITHUB_SHA::12}"
            echo "::endgroup::"
          done

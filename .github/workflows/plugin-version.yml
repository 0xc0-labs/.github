# Reusable: a PR that changes a Claude Code plugin bumps its version. A
# session gets a new copy only when the version changes, so a change without
# a bump never reaches the sessions that auto-update it.
name: plugin-version

on:
  workflow_call:
    inputs:
      plugins:
        description: Directory holding one directory per plugin, relative to the repo root.
        type: string
        default: plugins
      marketplace:
        description: The marketplace file, relative to the repo root.
        type: string
        default: .claude-plugin/marketplace.json
      skip-paths:
        description: Globs added to the paths that never cause a check (README, Path gates).
        type: string
        default: ''
      work-paths:
        description: Globs that always cause a check, besides the plugins and the marketplace file (README, Path gates).
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # A plugin's markdown is the plugin: its skills change it as code does.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - id: changes
        uses: 0xc0-labs/.github/.github/actions/changes@main # nosemgrep: third-party-action-not-pinned-to-commit-sha, github-actions-mutable-action-tag - this org's own action, read from main like its reusable workflows
        with:
          paths: ${{ format('{0}/** {1}', inputs.plugins, inputs.marketplace) }}
          skip-paths: ${{ inputs.skip-paths }}
          work-paths: ${{ format('{0}/** {1} {2}', inputs.plugins, inputs.marketplace, inputs.work-paths) }}

  check:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Claude Code takes plugin.json's version over the marketplace entry's
      # without warning, so an entry that declares one must agree with it.
      - name: versions
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PLUGINS: ${{ inputs.plugins }}
          MARKETPLACE: ${{ inputs.marketplace }}
        run: |
          if [ -z "$BASE" ]; then
            echo "Not a pull request: nothing to compare."; exit 0
          fi
          PLUGINS="${PLUGINS%/}"
          # Without renames, a file moved between plugins changes both.
          names=""
          while IFS= read -r f; do
            rest="${f#"$PLUGINS"/}"
            case "$rest" in */*) names="$names${rest%%/*}"$'\n' ;; esac
          done <<< "$(git diff --name-only --no-renames "$BASE...HEAD" -- "$PLUGINS")"
          names="$(printf '%s' "$names" | sort -u)"
          if [ -z "$names" ]; then
            echo "No plugin changed."; exit 0
          fi
          status=0
          while IFS= read -r name; do
            dir="$PLUGINS/$name"
            manifest="$dir/.claude-plugin/plugin.json"
            if [ ! -d "$dir" ]; then
              echo "$name: removed."; continue
            fi
            base="$(git show "$BASE:$manifest" 2>/dev/null | jq -r '.version // empty' 2>/dev/null || true)"
            head="$(jq -r '.version // empty' "$manifest" 2>/dev/null || true)"
            if [ -z "$head" ] || [ "$head" = "$base" ]; then
              echo "::error file=$manifest::$name changed, version ${base:-none} at the base and ${head:-none} at the head. Give it a new version in $manifest."
              status=1
            else
              echo "$name: ${base:-new} -> $head."
            fi
            [ -f "$MARKETPLACE" ] || continue
            if ! listed="$(jq -r --arg n "$name" '.plugins[]? | select(.name == $n) | .version // empty' "$MARKETPLACE")"; then
              echo "::error file=$MARKETPLACE::$MARKETPLACE is not valid JSON."
              status=1
            elif [ -n "$listed" ] && [ "$listed" != "$head" ]; then
              echo "::error file=$MARKETPLACE::$name is ${listed} in $MARKETPLACE but ${head:-none} in $manifest, and Claude Code uses plugin.json's without warning. Drop the entry's version, or make them equal."
              status=1
            fi
          done <<< "$names"
          exit $status

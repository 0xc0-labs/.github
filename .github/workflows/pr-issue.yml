# Reusable: fail a PR that links no issue, unless the org's GitHub Apps open it.
name: pr-issue

on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: linked issue
        env:
          EVENT: ${{ github.event_name }}
          # Read from the environment, never interpolated into the script.
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # A PR joins a merge queue only once its required checks pass, this
          # one included (README, A repo with a merge queue).
          if [ "$EVENT" = merge_group ]; then
            echo "A merge group: each of its PRs passed this check."
            exit 0
          fi
          # A login ending in [bot] belongs to a GitHub App: no person can
          # register one.
          case "$AUTHOR" in
            "0xc0-labs-promoter[bot]" | "0xc0-labs-renovate[bot]")
              echo "Opened by $AUTHOR: no linked issue needed."
              exit 0
              ;;
          esac
          pattern='(^|[^[:alnum:]])(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?)[[:space:]]+([[:alnum:]_.-]+/[[:alnum:]_.-]+)?#[0-9]+'
          if printf '%s' "$BODY" | grep -Eiq "$pattern"; then
            echo "Linked issue found."
          else
            echo "::error::The PR body must link an issue: 'Closes #N', 'Refs #N' or 'Refs owner/repo#N'. Every change needs an issue on the org project board."
            exit 1
          fi

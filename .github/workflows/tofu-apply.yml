# Reusable: apply an OpenTofu root inside its approval-gated environment.
name: tofu-apply

on:
  workflow_call:
    inputs:
      working-directory:
        description: OpenTofu root to apply, relative to the repo root.
        type: string
        required: true
      environment:
        description: Environment whose reviewers must approve the apply.
        type: string
        default: production
      tools:
        description: mise tools to install. Only these — a broken, unrelated tool in the repo's mise.toml must not block a plan or an apply.
        type: string
        default: opentofu
      runs-on:
        description: >-
          Where the job runs, as JSON. Defaults to the self-hosted runners on
          the CI VMs, inside the network.
        type: string
        default: '{"group": "0xc0", "labels": "0xc0"}'
      vault-addr:
        description: Vault's address, for a root whose provider talks to Vault. Empty, the job does not log in to Vault.
        type: string
        default: ""
      vault-role:
        description: Vault JWT auth role the job logs in with, through GitHub's OIDC token. Required with vault-addr.
        type: string
        default: ""
      vault-secrets:
        description: >-
          The secrets the job reads from Vault once logged in, in
          hashicorp/vault-action's format ("<path> <key> | <ENV_VAR>;" per
          line): each lands in the job's environment, masked. Every secret
          the job needs comes from here.
        type: string
        default: ""
      skip-paths:
        description: Globs added to the paths that never cause an apply (README, Path gates).
        type: string
        default: ''
      work-paths:
        description: Globs that always cause an apply, even where the central list ignores them (README, Path gates).
        type: string
        default: ''

jobs:
  # Only the central list: a root's inputs reach beyond environments/ and
  # modules/, and the apply re-plans anyway.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - id: changes
        uses: 0xc0-labs/.github/.github/actions/changes@main # nosemgrep: third-party-action-not-pinned-to-commit-sha, github-actions-mutable-action-tag - this org's own action, read from main like its reusable workflows
        with:
          skip-paths: ${{ inputs.skip-paths }}
          work-paths: ${{ inputs.work-paths }}

  tofu:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # A fork could call this from a PR of its own: GitHub's runners, no secrets.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON(inputs.runs-on) }}
    environment: ${{ inputs.environment }}
    # id-token: for the Vault login; the caller grants it even without Vault.
    permissions:
      contents: read
      id-token: write
    # Never cancelled, and a waiting run may be replaced: README, Concurrency.
    concurrency:
      group: tofu-apply-${{ github.repository }}-${{ inputs.working-directory }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_CLI_ARGS_plan: "-lock-timeout=10m"
      TF_CLI_ARGS_apply: "-lock-timeout=10m"
      ROOT: ${{ inputs.working-directory }}
      VAULT_ADDR: ${{ inputs.vault-addr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: ${{ inputs.tools }}

      - name: vault
        if: inputs.vault-addr != ''
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ inputs.vault-addr }}
          method: jwt
          path: jwt
          role: ${{ inputs.vault-role }}
          jwtGithubAudience: ${{ inputs.vault-addr }}
          exportToken: true
          secrets: ${{ inputs.vault-secrets }}

      - name: init
        run: |
          tofu -chdir="$ROOT" init -no-color

      - name: plan
        run: |
          tofu -chdir="$ROOT" plan -no-color -out=tfplan

      - name: apply
        run: |
          tofu -chdir="$ROOT" apply -no-color tfplan

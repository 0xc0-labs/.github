# Reusable: lint, type-check, build and, with `test: true`, test a Node app,
# with only node and pnpm from its mise.toml (README, Application repos).
name: node-check

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory of the app's package.json, relative to the repo root.
        type: string
        default: .
      runs-on:
        description: >-
          Where the job runs, as JSON. GitHub's runners by default, for a
          public repo; '{"group": "0xc0", "labels": "0xc0"}' for the
          self-hosted runners, which a private application runs on, once
          the runner group admits its repo. A PR from a fork always runs on
          "ubuntu-latest", never on the self-hosted ones.
        type: string
        default: '"ubuntu-latest"'
      tools:
        description: >-
          mise tools to install besides node and pnpm, space-separated,
          pinned in the caller's mise.toml: what the tests need.
        type: string
        default: ''
      test:
        description: >-
          Run `pnpm test` after the build. The tests start what they need
          themselves; the tools they need go in `tools`.
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON(inputs.runs-on) }}
    # The same group as container-image's job, so a caller's image job needs
    # its check job (README, Concurrency).
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          working_directory: ${{ inputs.working-directory }}
          install_args: node pnpm${{ inputs.tools != '' && format(' {0}', inputs.tools) || '' }}

      # pnpm expands ${NODE_AUTH_TOKEN} itself: the token is never written.
      - name: install
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          # shellcheck disable=SC2016
          printf '%s\n' "@$GITHUB_REPOSITORY_OWNER:registry=https://npm.pkg.github.com" \
            '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$RUNNER_TEMP/npmrc"
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc" pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: build
        run: pnpm build

      - name: test
        if: inputs.test
        run: pnpm test

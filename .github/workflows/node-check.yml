# Reusable: lint, type-check and build a Node app with its own mise toolchain.
# From the caller's mise.toml it installs only what its steps run, node and
# pnpm, at the versions there, checked against its mise.lock. The tools a repo
# declares for people (a language server, Claude Code's plugins, a local
# object store) are not downloaded. `tools` adds names to that list; none of
# today's callers needs it.
name: node-check

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory of the app's package.json, relative to the repo root.
        type: string
        default: .
      runs-on:
        description: >-
          Where the job runs, as JSON. GitHub's runners by default, for a
          public repo; '{"group": "0xc0", "labels": "0xc0"}' for the
          self-hosted runners, which a private application runs on, once
          the runner group admits its repo. A PR from a fork always runs on
          "ubuntu-latest", never on the self-hosted ones.
        type: string
        default: '"ubuntu-latest"'
      tools:
        description: >-
          mise tools to install besides node and pnpm, space-separated,
          pinned in the caller's mise.toml.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON(inputs.runs-on) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          working_directory: ${{ inputs.working-directory }}
          install_args: node pnpm${{ inputs.tools != '' && format(' {0}', inputs.tools) || '' }}

      - name: install
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: build
        run: pnpm build

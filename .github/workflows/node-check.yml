# Reusable: lint, type-check, build and, with `test: true`, test a Node app,
# with only node and pnpm from its mise.toml (README, Application repos).
name: node-check

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory of the app's package.json, relative to the repo root.
        type: string
        default: .
      runs-on:
        description: >-
          Where the job runs, as JSON. Empty by default: GitHub's runners
          for a public repo, the org's `build` runners (group 0xc0, one per
          CI VM) for a private one (README, Application repos). Set it, such
          as '{"group": "0xc0", "labels": ["0xc0"]}', to choose. A PR from a
          fork always runs on "ubuntu-latest", never on the self-hosted ones.
        type: string
        default: ''
      tools:
        description: >-
          mise tools to install besides node and pnpm, space-separated,
          pinned in the caller's mise.toml: what the tests need.
        type: string
        default: ''
      test:
        description: >-
          Run `pnpm test` after the build. The tests start what they need
          themselves; the tools they need go in `tools`.
        type: boolean
        default: false
      coverage:
        description: >-
          Run the tests with Vitest's V8 coverage and report it in the job
          summary and, on a PR, in one comment. Needs `test: true`, and the
          caller granting `pull-requests: write` (README, Application repos).
          Never fails on a figure.
        type: boolean
        default: false
      skip-paths:
        description: Globs added to the paths that never cause a check (README, Path gates).
        type: string
        default: ''
      work-paths:
        description: Globs that always cause a check, even where the central list ignores them (README, Path gates).
        type: string
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  # Under working-directory, and the repo-root files that decide what it
  # installs: README, Path gates.
  changes:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || (github.event.repository.private && fromJSON('{"group":"0xc0","labels":"0xc0"}') || 'ubuntu-latest') }}
    permissions:
      contents: read
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - id: changes
        uses: 0xc0-labs/.github/.github/actions/changes@main # nosemgrep: third-party-action-not-pinned-to-commit-sha, github-actions-mutable-action-tag - this org's own action, read from main like its reusable workflows
        with:
          paths: ${{ inputs.working-directory != '.' && format('{0}/** mise.toml mise.lock .mise/** pnpm-lock.yaml pnpm-workspace.yaml .npmrc', inputs.working-directory) || '' }}
          skip-paths: ${{ inputs.skip-paths }}
          work-paths: ${{ inputs.work-paths }}

  check:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: >-
      ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest'
      || fromJSON(inputs.runs-on != '' && inputs.runs-on
      || (github.event.repository.private && '{"group": "0xc0", "labels": ["build"]}' || '"ubuntu-latest"')) }}
    # The same group as container-image's job, so a caller's image job needs
    # its check job (README, Concurrency).
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      # A pass of this same commit stands in for the tests on ready_for_review (README, Concurrency, Drafts).
      - id: passed
        if: github.event_name == 'pull_request' && github.event.action == 'ready_for_review'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/node-check-passed
          key: node-check-passed-${{ github.sha }}-${{ inputs.working-directory }}
          lookup-only: true

      - if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: steps.passed.outputs.cache-hit != 'true'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          working_directory: ${{ inputs.working-directory }}
          install_args: node pnpm${{ inputs.tools != '' && format(' {0}', inputs.tools) || '' }}

      # pnpm expands ${NODE_AUTH_TOKEN} itself: the token is never written.
      - name: install
        if: steps.passed.outputs.cache-hit != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          # shellcheck disable=SC2016
          printf '%s\n' "@$GITHUB_REPOSITORY_OWNER:registry=https://npm.pkg.github.com" \
            '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$RUNNER_TEMP/npmrc"
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc" pnpm install --frozen-lockfile

      - name: lint
        if: steps.passed.outputs.cache-hit != 'true'
        run: pnpm lint

      - name: typecheck
        if: steps.passed.outputs.cache-hit != 'true'
        run: pnpm typecheck

      - name: build
        if: steps.passed.outputs.cache-hit != 'true'
        run: pnpm build

      - name: test
        if: steps.passed.outputs.cache-hit != 'true' && inputs.test
        env:
          COVERAGE: ${{ inputs.coverage }}
        run: |
          if [ "$COVERAGE" = true ]; then
            pnpm test --coverage --coverage.reporter=json-summary --coverage.reporter=text-summary
          else
            pnpm test
          fi

      # The comment is coverage-comment's, a workflow of its own: this one
      # asks its caller for no new permission. File names come from the PR:
      # they reach the script only through files and the environment.
      - name: coverage
        id: coverage
        if: steps.passed.outputs.cache-hit != 'true' && inputs.test && inputs.coverage
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p "$RUNNER_TEMP/coverage-report"
          changed="$RUNNER_TEMP/changed.txt"
          : > "$changed"
          if [ -n "${BASE_SHA//0/}" ] && git fetch --quiet --depth=1 origin "$BASE_SHA" 2> /dev/null; then
            git diff --name-only "$BASE_SHA" HEAD > "$changed"
          fi
          CHANGED_LIST="$changed" node --input-type=module <<'EOF'
          import { appendFileSync, existsSync, readFileSync, writeFileSync } from 'node:fs'
          import { relative, resolve } from 'node:path'

          const summaryFile = 'coverage/coverage-summary.json'
          if (!existsSync(summaryFile)) {
            console.log('::warning::no coverage summary: is @vitest/coverage-v8 pinned? (README, node-check)')
            process.exit(0)
          }
          const summary = JSON.parse(readFileSync(summaryFile, 'utf8'))
          const root = process.env.GITHUB_WORKSPACE
          const changed = new Set(readFileSync(process.env.CHANGED_LIST, 'utf8').split('\n').filter(Boolean))
          const cell = (m) => `${m.pct}% (${m.covered}/${m.total})`
          const row = (name, d) => `| ${name} | ${cell(d.lines)} | ${cell(d.branches)} | ${cell(d.functions)} | ${cell(d.statements)} |`
          const clean = (name) => name.replace(/[`|\r\n]/g, '?')

          const files = Object.entries(summary)
            .filter(([name]) => name !== 'total')
            .map(([name, data]) => [relative(root, resolve(name)), data])
            .filter(([name]) => changed.has(name))
            .sort(([a], [b]) => a.localeCompare(b))
          const shown = files.slice(0, 50)

          const lines = [
            '### Test coverage',
            '',
            '| | Lines | Branches | Functions | Statements |',
            '|---|---|---|---|---|',
            row('**Total**', summary.total),
            ...shown.map(([name, data]) => row('`' + clean(name) + '`', data)),
          ]
          if (files.length > shown.length) lines.push('', `${files.length - shown.length} more changed files not shown.`)
          if (files.length === 0) lines.push('', 'No changed file is measured.')
          const report = lines.join('\n')

          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${report}\n`)
          writeFileSync(`${process.env.RUNNER_TEMP}/coverage-report/report.md`, report)
          EOF

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.passed.outputs.cache-hit != 'true' && inputs.test && inputs.coverage
        with:
          name: coverage-report
          path: ${{ runner.temp }}/coverage-report/report.md
          if-no-files-found: ignore
          retention-days: 7

      - name: record the pass
        if: steps.passed.outputs.cache-hit != 'true'
        run: echo "$GITHUB_SHA" > "$RUNNER_TEMP/node-check-passed"

      - if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/node-check-passed
          key: node-check-passed-${{ github.sha }}-${{ inputs.working-directory }}

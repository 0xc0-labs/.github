# Reusable: Semgrep Community Edition over the caller's repo, with the engine
# from the caller's mise.toml and a pinned commit of semgrep/semgrep-rules.
# Only the rules whose metadata category is security run. No login, no
# telemetry; a finding fails the job (README, Semgrep).
#
# Not named release*: that glob is the Vault role the release jobs log in
# with, and this one logs in nowhere, so it runs on GitHub's runners.
name: semgrep

on:
  workflow_call:
    inputs:
      rules-ref:
        description: >-
          Commit of semgrep/semgrep-rules the rules are read from, never a
          branch. Bumped here, in one PR, for every caller at once.
        type: string
        default: 9bbf021d0acffa3095fcffd17b2bc7787eb4796d
      rule-sets:
        description: >-
          Directories of semgrep-rules to take the security rules from,
          space-separated: what the org writes (README, Semgrep).
        type: string
        default: typescript javascript terraform yaml/kubernetes yaml/github-actions dockerfile bash python
      tools:
        description: mise tools to install, pinned in the caller's mise.toml.
        type: string
        default: python uv pipx:semgrep
      skip-paths:
        description: Globs added to the paths that never cause a scan (README, Path gates).
        type: string
        default: ''
      work-paths:
        description: Globs that always cause a scan, even where the central list ignores them (README, Path gates).
        type: string
        default: ''

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - id: changes
        uses: 0xc0-labs/.github/.github/actions/changes@main # nosemgrep: third-party-action-not-pinned-to-commit-sha, github-actions-mutable-action-tag - this org's own action, read from main like its reusable workflows
        with:
          skip-paths: ${{ inputs.skip-paths }}
          work-paths: ${{ inputs.work-paths }}

  scan:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RULE_SETS: ${{ inputs.rule-sets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fetched, never vendored: the Semgrep Rules License lets us use the
      # rules for our own business, not distribute them, and this repo is
      # public (README, Semgrep).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: semgrep/semgrep-rules
          ref: ${{ inputs.rules-ref }}
          path: .semgrep-rules
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: ${{ inputs.tools }}

      # Several directories mix security with style, best-practice and
      # framework rules, so rules are chosen one by one, not by directory.
      # The rule files are laid out the same way, each rule opening with
      # "  - id:" (README, Semgrep).
      - name: select security rules
        run: |
          python - "$RUNNER_TEMP/security-rules" $RULE_SETS <<'PY'
          import os, re, sys

          dst, sets = sys.argv[1], sys.argv[2:]
          start = re.compile(r"^ {0,2}- id: ")
          security = re.compile(r"^\s+category:\s*security\s*$", re.M)
          kept = left_out = 0
          for rule_set in sets:
              for dirpath, _, files in os.walk(os.path.join(".semgrep-rules", rule_set)):
                  for name in files:
                      if not name.endswith((".yaml", ".yml")):
                          continue
                      path = os.path.join(dirpath, name)
                      lines = open(path).read().splitlines(keepends=True)
                      starts = [i for i, line in enumerate(lines) if start.match(line)]
                      blocks = ["".join(lines[a:b]) for a, b in zip(starts, starts[1:] + [len(lines)])]
                      wanted = [b for b in blocks if security.search(b)]
                      kept += len(wanted)
                      left_out += len(blocks) - len(wanted)
                      if wanted:
                          out = os.path.join(dst, os.path.relpath(path, ".semgrep-rules"))
                          os.makedirs(os.path.dirname(out), exist_ok=True)
                          with open(out, "w") as f:
                              f.write("rules:\n" + "".join(wanted))
          print(f"security rules: {kept}, left out: {left_out}")
          if kept == 0:
              sys.exit("no security rule selected")
          PY

      - name: scan
        run: |
          # Findings are read from the JSON, which leaves out what a nosemgrep
          # waives; the exit code is the verdict.
          status=0
          semgrep scan --metrics=off --disable-version-check --error \
            --json-output="$RUNNER_TEMP/semgrep.json" --exclude .semgrep-rules --config "$RUNNER_TEMP/security-rules" . || status=$?
          echo "SEMGREP_STATUS=$status" >> "$GITHUB_ENV"

      - name: summary
        run: |
          {
            echo "## Semgrep"
            count=$(jq '.results | length' "$RUNNER_TEMP/semgrep.json")
            if [ "$count" = 0 ]; then
              echo "No findings."
            else
              echo "| File | Line | Rule |"
              echo "|---|---|---|"
              jq -r '.results[] | "| \(.path) | \(.start.line) | \(.check_id | split(".") | .[-1]) |"' "$RUNNER_TEMP/semgrep.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: verdict
        run: exit "$SEMGREP_STATUS"

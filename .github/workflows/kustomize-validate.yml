# Reusable: render each Kustomize component as Argo CD does, and validate it.
name: kustomize-validate

on:
  workflow_call:
    inputs:
      components:
        description: Glob of component directories, each with a kustomization.yaml, relative to the repo root.
        type: string
        default: platform/*
      manifests:
        description: Directory of plain manifests to validate as they are. Empty skips it.
        type: string
        default: bootstrap
      kubernetes-version:
        description: Kubernetes version the schemas are checked against.
        type: string
        default: 1.36.0
      tools:
        description: mise tools to install, pinned in the caller's mise.toml.
        type: string
        default: kustomize helm kubeconform
      skip-paths:
        description: Globs added to the paths that never cause a validation (README, Path gates).
        type: string
        default: ''
      work-paths:
        description: Globs that always cause one, even where the central list ignores them (README, Path gates).
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # Under the components and the manifests: README, Path gates.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - id: paths
        uses: 0xc0-labs/.github/.github/actions/component-paths@main # nosemgrep: third-party-action-not-pinned-to-commit-sha, github-actions-mutable-action-tag - this org's own action, read from main like its reusable workflows
        with:
          components: ${{ inputs.components }}
          manifests: ${{ inputs.manifests }}

      - id: changes
        uses: 0xc0-labs/.github/.github/actions/changes@main # nosemgrep: third-party-action-not-pinned-to-commit-sha, github-actions-mutable-action-tag - this org's own action, read from main like its reusable workflows
        with:
          paths: ${{ steps.paths.outputs.paths }}
          skip-paths: ${{ inputs.skip-paths }}
          work-paths: ${{ inputs.work-paths }}

  validate:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      COMPONENTS: ${{ inputs.components }}
      MANIFESTS: ${{ inputs.manifests }}
      KUBE_VERSION: ${{ inputs.kubernetes-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: ${{ inputs.tools }}

      # CRDs have no schema here: their objects are skipped, not failed.
      - name: components
        run: |
          status=0
          for dir in $COMPONENTS; do
            [ -f "$dir/kustomization.yaml" ] || continue
            echo "::group::$dir"
            if ! kustomize build --enable-helm "$dir" > "$RUNNER_TEMP/render.yaml"; then
              echo "::error title=$dir::kustomize build failed"
              status=1
            elif ! kubeconform -strict -ignore-missing-schemas -kubernetes-version "$KUBE_VERSION" -summary "$RUNNER_TEMP/render.yaml"; then
              echo "::error title=$dir::invalid manifests"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: manifests
        if: inputs.manifests != ''
        run: kubeconform -strict -ignore-missing-schemas -kubernetes-version "$KUBE_VERSION" -summary "$MANIFESTS"

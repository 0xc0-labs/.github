# Reusable: on a push to main, release one package of a monorepo when its
# directory has something new (README, Shared packages).
#
# The release's contents are the last commit that changed the directory, not
# the push's: git-cliff, filtering commits by path, does not see a tag on a
# commit outside it, and would count the same commits again. Its tag goes on
# the push's commit (the tag step says why).
name: package-release

on:
  workflow_call:
    inputs:
      directory:
        description: >-
          The package's directory, relative to the repo root:
          packages/<name>. Its package.json is named @<owner>/<name>.
        type: string
        required: true
      runs-on:
        description: >-
          Where the job runs, as JSON. Empty by default: GitHub's runners
          for a public repo, the org's runners (group 0xc0) for a private
          one (README, Shared packages). Set it, such as '"ubuntu-latest"',
          to choose. A PR from a fork always runs on "ubuntu-latest".
        type: string
        default: ''
      skip-paths:
        description: Globs added to the paths that never cause a release (README, Path gates).
        type: string
        default: ''
      work-paths:
        description: Globs that always cause a release check, besides the package's own directory (README, Path gates).
        type: string
        default: ''

env:
  # Whatever the caller's cliff.toml says: while in 0.x, a breaking change
  # bumps the minor. The tag pattern and the first version are the package's,
  # set once its name is known.
  GIT_CLIFF__BUMP__BREAKING_ALWAYS_BUMP_MAJOR: "false"

jobs:
  # The package's README ships in it, so a change there counts. A push that
  # touches only another package still runs: the job finds a release its last
  # push left undone.
  changes:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || (github.event.repository.private && fromJSON('{"group":"0xc0","labels":"0xc0"}') || 'ubuntu-latest') }}
    permissions:
      contents: read
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - id: changes
        uses: 0xc0-labs/.github/.github/actions/changes@main # nosemgrep: third-party-action-not-pinned-to-commit-sha, github-actions-mutable-action-tag - this org's own action, read from main like its reusable workflows
        with:
          skip-paths: ${{ inputs.skip-paths }}
          work-paths: ${{ format('{0}/** {1}', inputs.directory, inputs.work-paths) }}

  release:
    needs: changes
    if: needs.changes.outputs.run == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: >-
      ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest'
      || fromJSON(inputs.runs-on != '' && inputs.runs-on
      || (github.event.repository.private && '{"group": "0xc0", "labels": ["0xc0"]}' || '"ubuntu-latest"')) }}
    permissions:
      contents: write # the tag and the GitHub Release
      packages: write # the npm package
    # One release at a time per package, in order. A newer push replaces one
    # still waiting: it holds the same commits and more.
    concurrency:
      group: package-release-${{ github.repository }}-${{ inputs.directory }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Before the tools, so they are the release commit's.
      - name: commit
        id: commit
        env:
          DIRECTORY: ${{ inputs.directory }}
        run: |
          dir="${DIRECTORY%/}"
          name="${dir##*/}"
          if ! [[ "$name" =~ ^[a-z0-9][a-z0-9-]*$ ]] || [ ! -f "$dir/package.json" ]; then
            echo "::error::'$DIRECTORY' is not a package's directory: packages/<name>, lowercase, with its package.json."
            exit 1
          fi
          commit=$(git log -1 --format=%H HEAD -- "$dir")
          git checkout -q --detach "$commit"
          echo "The last commit to change $dir is $commit."
          {
            echo "GIT_CLIFF__GIT__TAG_PATTERN=^$name-v[0-9]+\.[0-9]+\.[0-9]+\$"
            echo "GIT_CLIFF__BUMP__INITIAL_TAG=$name-v0.1.0"
          } >> "$GITHUB_ENV"
          {
            echo "dir=$dir"
            echo "name=$name"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: node pnpm git-cliff

      - name: version
        id: version
        env:
          DIR: ${{ steps.commit.outputs.dir }}
          NAME: ${{ steps.commit.outputs.name }}
          COMMIT: ${{ steps.commit.outputs.commit }}
        run: |
          releases() { grep -Ex "$NAME-v[0-9]+\.[0-9]+\.[0-9]+"; }
          tag=$(git tag --points-at HEAD --list "$NAME-v*" --sort=-v:refname | releases | head -n1)
          if [ -n "$tag" ]; then
            echo "$COMMIT is $tag already."
          else
            # A release of $COMMIT is tagged on the run's commit of that time,
            # after it: HEAD cannot see it, and git-cliff would count it as
            # the newest tag and bump past it.
            for later in $(git tag --merged "$GITHUB_SHA" --no-merged HEAD --list "$NAME-v*" --sort=-v:refname | releases); do
              if git diff --quiet "$later" "$COMMIT" -- "$DIR"; then
                tag=$later
                echo "$later is on $(git rev-parse --short "$later") already, with the contents of $COMMIT."
                break
              fi
            done
          fi
          if [ -n "$tag" ]; then
            tagged=true
          else
            last=$(git tag --merged HEAD --list "$NAME-v*" --sort=-v:refname | releases | head -n1)
            # The range, because git-cliff ignores a tag outside the path, and
            # the tag goes on the run's commit: without it, the next release
            # computes $last again (#174).
            tag=$(git cliff --bumped-version --include-path "$DIR/**" ${last:+"$last..HEAD"})
            if ! [[ "$tag" =~ ^$NAME-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::git-cliff gave '$tag', not a version of $NAME."
              exit 1
            fi
            if [ "$tag" = "$last" ]; then
              echo "Nothing in $DIR since $last bumps its version: no release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
              echo "::error::The tag $tag exists already, but not on a commit of this run's history with the contents of $DIR at $COMMIT."
              exit 1
            fi
            tagged=false
          fi
          previous=$(git tag --merged HEAD --list "$NAME-v*" --sort=-v:refname | releases | grep -vxF "$tag" | head -n1)
          git cliff --include-path "$DIR/**" --tag "$tag" --strip all "${previous:+$previous..}$COMMIT" > "$RUNNER_TEMP/changelog.md"
          {
            echo "release=true"
            echo "tag=$tag"
            echo "version=${tag#"$NAME"-v}"
            echo "tagged=$tagged"
          } >> "$GITHUB_OUTPUT"

      - name: tag
        if: steps.version.outputs.release == 'true' && steps.version.outputs.tagged == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        # On the run's commit, not the package's last: GitHub refuses a new ref
        # from an App when its commit's workflow files differ from the default
        # branch's, and that commit lags behind whenever another PR changes a
        # workflow (#174). The npm package is still built from the package's.
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: npm package
        if: steps.version.outputs.release == 'true'
        working-directory: ${{ steps.commit.outputs.dir }}
        env:
          DIR: ${{ steps.commit.outputs.dir }}
          NAME: ${{ steps.commit.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
          TAGGED: ${{ steps.version.outputs.tagged }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          package="@$GITHUB_REPOSITORY_OWNER/$NAME"
          if [ "$(node -p 'require("./package.json").name')" != "$package" ]; then
            echo "::error file=$DIR/package.json::Its name must be $package: its directory's, in the org's scope."
            exit 1
          fi
          # GitHub Packages links the package to the repo this names, and this
          # job's token publishes only to its own.
          repository=$(node -p 'const r = require("./package.json").repository; (typeof r === "string" ? r : r?.url) ?? ""')
          case "$repository" in
            *"github.com/$GITHUB_REPOSITORY" | *"github.com/$GITHUB_REPOSITORY.git") ;;
            *)
              echo "::error file=$DIR/package.json::Its repository.url must be git+https://github.com/$GITHUB_REPOSITORY.git, not '$repository'."
              exit 1
              ;;
          esac
          # npm and pnpm expand ${NODE_AUTH_TOKEN} themselves: the token is
          # never written.
          # shellcheck disable=SC2016
          printf '%s\n' "@$GITHUB_REPOSITORY_OWNER:registry=https://npm.pkg.github.com" \
            '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$RUNNER_TEMP/npmrc"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc"
          theirs=$(npm view "$package@$VERSION" dist.integrity 2> /dev/null || true)
          if [ -n "$theirs" ] && [ "$TAGGED" = true ]; then
            echo "$package@$VERSION is published already."
            exit 0
          fi
          pnpm install --frozen-lockfile
          npm pkg set "version=$VERSION"
          pnpm run --if-present build
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
          tarball=$(echo "$RUNNER_TEMP"/pack/*.tgz)
          ours="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
          # pnpm packs the same bytes from the same commit, so integrities compare.
          if [ -n "$theirs" ]; then
            if [ "$theirs" != "$ours" ]; then
              echo "::error::$package@$VERSION is published with other contents ($theirs, not $ours)."
              exit 1
            fi
            echo "$package@$VERSION is published already, with these contents."
            exit 0
          fi
          npm publish "$tarball" --ignore-scripts
          {
            echo "### Package released"
            echo
            echo "\`$package@$VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Not marked latest: each package has its own, and the repo none.
      - name: GitHub Release
        if: steps.version.outputs.release == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const fs = require('fs');
            const { TAG } = process.env;
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag: TAG });
              core.info(`The Release ${TAG} exists already: ${data.html_url}`);
              return;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            const { data } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: TAG,
              name: TAG,
              body: fs.readFileSync(`${process.env.RUNNER_TEMP}/changelog.md`, 'utf8'),
              make_latest: 'false',
            });
            core.notice(`${TAG}: ${data.html_url}`);

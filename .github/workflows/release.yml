# Reusable: by hand, release the rc staging runs, or the rc named, and offer
# it to prod in gitops; for an app with no staging, release each commit pushed
# to main, after its image (README, Application repos). Tools, Vault and most
# steps as in release-candidate.yml.
name: release

on:
  workflow_call:
    inputs:
      app:
        description: The application's folder in gitops, apps/<app>/.
        type: string
        required: true
      npm-package:
        description: >-
          Directory of an npm package to publish to GitHub Packages with the
          release's version, under the latest dist-tag, from the rc's commit.
          It is published as committed: no install, no lifecycle scripts.
          Empty, nothing is published.
        type: string
        default: ""
      extra-images:
        description: >-
          Suffixes of the repo's second images, space separated, as in
          release-candidate.yml. Each is tagged and pinned with the repo's
          own, under one version.
        type: string
        default: ''
      runs-on:
        description: >-
          Where the job runs, as JSON. The self-hosted runners by default:
          Vault is reached only from inside the network.
        type: string
        default: '{"group": "0xc0", "labels": "0xc0"}'
      rc:
        description: >-
          The rc to release, vX.Y.Z-rc.N. Empty, the rc staging runs. Named,
          its image tag gives the digest, and the run fails if it does not
          exist: for finishing a release whose run failed after staging moved
          on.
        type: string
        default: ""
      staging:
        description: >-
          False for an app with no staging, called on every push to main
          after the image job: the commit pushed is the release, its version
          from git-cliff and its digest from the image's sha-<7> tag. No rc,
          and nothing read from staging; rc stays empty.
        type: boolean
        default: true
      skip-paths:
        description: Globs added to the paths that never cause a release on a push (README, Path gates).
        type: string
        default: ''
      work-paths:
        description: Globs that always cause one, even where the central list ignores them, such as markdown the image copies in (README, Path gates).
        type: string
        default: ''

env:
  VAULT_ADDR: https://vault.int.0xc0.cc
  # As release-candidate.yml: only a release is the previous version, and with
  # no staging the version is bumped as an rc's is.
  GIT_CLIFF__GIT__TAG_PATTERN: '^v[0-9]+\.[0-9]+\.[0-9]+$'
  GIT_CLIFF__BUMP__INITIAL_TAG: v0.1.0
  GIT_CLIFF__BUMP__BREAKING_ALWAYS_BUMP_MAJOR: "false"

jobs:
  # A run by hand always releases: the gate reads a push's diff.
  changes:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || (github.event.repository.private && fromJSON('{"group":"0xc0","labels":"0xc0"}') || 'ubuntu-latest') }}
    permissions:
      contents: read
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - id: changes
        uses: 0xc0-labs/.github/.github/actions/changes@main # nosemgrep: third-party-action-not-pinned-to-commit-sha, github-actions-mutable-action-tag - this org's own action, read from main like its reusable workflows
        with:
          skip-paths: ${{ inputs.skip-paths }}
          work-paths: ${{ inputs.work-paths }}

  release:
    needs: changes
    if: needs.changes.outputs.run == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: write # the release's tag and the GitHub Release
      packages: write # the image's tag and the npm package
      id-token: write # the Vault login
    # One release at a time per repo, in order. With no staging, a newer push
    # replaces one still waiting: its release includes that commit.
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    env:
      APP: ${{ inputs.app }}
      IMAGE: ghcr.io/${{ github.repository }}
      EXTRA_IMAGES: ${{ inputs.extra-images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # As in release-candidate.yml.
      - name: images
        run: |
          images=$IMAGE
          for suffix in $EXTRA_IMAGES; do
            if ! [[ "$suffix" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
              echo "::error::extra-images has '$suffix', not lowercase words joined by '-'."
              exit 1
            fi
            images="$images ${IMAGE}-${suffix}"
          done
          echo "IMAGES=$images" >> "$GITHUB_ENV"

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: git-cliff crane${{ inputs.npm-package != '' && ' node' || '' }}

      - name: gitops
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/gitops
          path: _gitops
          persist-credentials: false

      - name: GHCR credentials, for this job alone
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
          mkdir -m 0700 "$RUNNER_TEMP/docker"
          auth=$(printf '%s:%s' "$GITHUB_ACTOR" "$GHCR_TOKEN" | base64 -w0)
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$auth" > "$RUNNER_TEMP/docker/config.json"

      # One line a image in $RUNNER_TEMP/digests, `<image> <digest>`. A second
      # image whose paths did not change was not built: with no staging it
      # keeps the digest prod pins.
      - name: image
        id: image
        working-directory: _gitops
        env:
          STAGING: ${{ inputs.staging }}
          RC: ${{ inputs.rc }}
        run: |
          mise trust --quiet
          mise install yq
          yq() { mise exec yq -- yq "$@"; }
          : > "$RUNNER_TEMP/digests"
          if [ "$STAGING" != true ]; then
            if [ -n "$RC" ]; then
              echo "::error::The rc input is '$RC', but an app with no staging has no rc."
              exit 1
            fi
            for image in $IMAGES; do
              if digest=$(crane digest "$image:sha-${GITHUB_SHA::7}" 2> "$RUNNER_TEMP/crane.err"); then
                echo "$image: built for this commit."
              elif [ "$image" != "$IMAGE" ] && grep -qE 'MANIFEST_UNKNOWN|NAME_UNKNOWN' "$RUNNER_TEMP/crane.err"; then
                pin="apps/$APP/prod/kustomization.yaml"
                [ -f "$pin" ] || { echo "::error::gitops has no $pin."; exit 1; }
                digest=$(IMAGE=$image yq '.images[] | select(.name == strenv(IMAGE)) | .digest // ""' "$pin")
                if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                  echo "::error file=$pin::$image is not built for this commit, and prod pins no digest of it."
                  exit 1
                fi
                echo "$image: not built for this commit, so prod's $digest."
              else
                cat "$RUNNER_TEMP/crane.err"
                echo "::error::No image $image:sha-${GITHUB_SHA::7}: the image job runs first."
                exit 1
              fi
              echo "$image $digest" >> "$RUNNER_TEMP/digests"
            done
            rc=""
            echo "No staging: the release is $GITHUB_SHA."
          elif [ -n "$RC" ]; then
            if ! [[ "$RC" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
              echo "::error::The rc input is '$RC', not vX.Y.Z-rc.N."
              exit 1
            fi
            for image in $IMAGES; do
              digest=$(crane digest "$image:$RC") ||
                { echo "::error::No image $image:$RC: the rc named does not exist."; exit 1; }
              echo "$image $digest" >> "$RUNNER_TEMP/digests"
            done
            rc=$RC
            echo "The run names $rc."
          else
            pin="apps/$APP/staging/kustomization.yaml"
            [ -f "$pin" ] || { echo "::error::gitops has no $pin."; exit 1; }
            rc=""
            for image in $IMAGES; do
              read -r tag digest < <(IMAGE=$image yq '.images[] | select(.name == strenv(IMAGE)) | [.newTag // "", .digest // ""] | join(" ")' "$pin")
              [ -n "$rc" ] || rc=${tag:-}
              if ! [[ "${tag:-}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ && "${digest:-}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "::error file=$pin::Staging's pin of $image is '${tag:-} ${digest:-}', not an rc and its digest."
                exit 1
              fi
              if [ "$tag" != "$rc" ]; then
                echo "::error file=$pin::Staging pins $image at $tag, but the application at $rc: one version covers every image."
                exit 1
              fi
              tagged=$(crane digest "$image:$rc")
              if [ "$tagged" != "$digest" ]; then
                echo "::error::$image:$rc is $tagged, but staging is pinned to $digest."
                exit 1
              fi
              echo "$image $digest" >> "$RUNNER_TEMP/digests"
            done
            echo "Staging runs $rc."
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      # The release is the rc's commit, or with no staging the commit pushed,
      # checked out for what follows. Its changelog runs from the release
      # before it, whether or not a rerun finds this release's tag on the
      # commit already. With no staging, a commit that a later release
      # contains, or whose commits git-cliff does not count, releases nothing.
      - name: version
        id: version
        env:
          RC: ${{ steps.image.outputs.rc }}
        run: |
          releases() { git tag "$@" --list 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V; }
          if [ -n "$RC" ]; then
            commit=$(git rev-parse -q --verify "refs/tags/$RC^{commit}") ||
              { echo "::error::No tag $RC in this repo."; exit 1; }
            version="${RC%-rc.*}"
          else
            commit=$GITHUB_SHA
            version=$(releases --points-at "$commit" | tail -n1)
            if [ -n "$version" ]; then
              echo "This commit is $version already."
            else
              latest=$(releases | tail -n1)
              if [ -n "$latest" ] && git merge-base --is-ancestor "$commit" "$latest"; then
                echo "::notice::$latest, released from a later commit, contains this one: nothing to release."
                echo "release=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              version=$(git cliff --bumped-version)
              version="v${version#v}"
              if [ "$version" = "$latest" ]; then
                echo "::notice::Nothing to release: git-cliff counts no commit since $latest."
                echo "release=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || git rev-parse -q --verify "refs/tags/$version" > /dev/null; then
                echo "::error::git-cliff gave '$version', not a version that has no release yet."
                exit 1
              fi
            fi
          fi
          newest=$({ releases; echo "$version"; } | sort -V | tail -n1)
          git checkout -q --detach "$commit"
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' "$commit^" 2> /dev/null || true)
          git cliff --tag "$version" --strip all "${previous:+$previous..}$commit" > "$RUNNER_TEMP/changelog.md"
          {
            echo "release=true"
            echo "version=$version"
            echo "commit=$commit"
            echo "newest=$newest"
          } >> "$GITHUB_OUTPUT"

      - name: tag
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          tagged=$(git rev-parse -q --verify "refs/tags/$VERSION^{commit}" || true)
          if [ -z "$tagged" ]; then
            git tag "$VERSION" "$COMMIT"
            git push origin "refs/tags/$VERSION"
          elif [ "$tagged" = "$COMMIT" ]; then
            echo "The tag $VERSION is on $COMMIT already."
          else
            echo "::error::The tag $VERSION is on $tagged, not on $COMMIT, the release's commit."
            exit 1
          fi
          while read -r image digest <&3; do
            if current=$(crane digest "$image:$VERSION" 2> /dev/null); then
              if [ "$current" != "$digest" ]; then
                echo "::error::$image:$VERSION is $current, not $digest."
                exit 1
              fi
              echo "$image:$VERSION is $digest already."
            else
              crane tag "$image@$digest" "$VERSION"
            fi
          done 3< "$RUNNER_TEMP/digests"
          {
            echo "### Release"
            echo
            while read -r image digest; do
              echo "- \`$VERSION\`: \`$image@$digest\`"
            done < "$RUNNER_TEMP/digests"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: GitHub Release
        id: release
        if: steps.version.outputs.release == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const { VERSION } = process.env;
            // On the tag checked above: if it is there, it is this release.
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag: VERSION });
              core.info(`The Release ${VERSION} exists already: ${data.html_url}`);
              core.setOutput('url', data.html_url);
              return;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            const { data } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: VERSION,
              name: VERSION,
              body: fs.readFileSync(`${process.env.RUNNER_TEMP}/changelog.md`, 'utf8'),
            });
            core.setOutput('url', data.html_url);

      - name: npm package
        if: inputs.npm-package != '' && steps.version.outputs.release == 'true'
        working-directory: ${{ inputs.npm-package }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          version="${VERSION#v}"
          name=$(node -p 'require("./package.json").name')
          # npm expands ${NODE_AUTH_TOKEN} itself: the token is never written.
          # shellcheck disable=SC2016
          printf '%s\n' "@$GITHUB_REPOSITORY_OWNER:registry=https://npm.pkg.github.com" \
            '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$RUNNER_TEMP/npmrc"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc"
          npm pkg set "version=$version"
          # As in release-candidate.yml.
          ours=$(npm pack --dry-run --json --ignore-scripts | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].integrity')
          if theirs=$(npm view "$name@$version" dist.integrity 2> /dev/null) && [ -n "$theirs" ]; then
            if [ "$theirs" != "$ours" ]; then
              echo "::error::$name@$version is published with other contents ($theirs, not $ours)."
              exit 1
            fi
            echo "$name@$version is published already, with these contents."
            exit 0
          fi
          npm publish --ignore-scripts

      - name: vault
        id: vault
        if: steps.version.outputs.release == 'true'
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          path: jwt
          role: ${{ github.event.repository.name }}
          jwtGithubAudience: ${{ env.VAULT_ADDR }}
          exportEnv: false
          outputToken: true
          secrets: |
            ci/data/shared/github-promoter-app app_id | APP_ID ;
            ci/data/shared/github-promoter-app installation_id | INSTALLATION_ID ;

      # As in release-candidate.yml.
      - name: promoter token
        id: promoter
        if: steps.version.outputs.release == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VAULT_TOKEN: ${{ steps.vault.outputs.vault_token }}
          APP_ID: ${{ steps.vault.outputs.APP_ID }}
          INSTALLATION_ID: ${{ steps.vault.outputs.INSTALLATION_ID }}
        with:
          script: |
            const { VAULT_ADDR, VAULT_TOKEN, APP_ID, INSTALLATION_ID } = process.env;
            const call = async (url, init) => {
              const res = await fetch(url, init);
              if (!res.ok) throw new Error(`${init.method} ${url}: ${res.status} ${await res.text()}`);
              return res.json();
            };
            const b64url = (s) => Buffer.from(s).toString('base64url');
            const now = Math.floor(Date.now() / 1000);
            const unsigned = [
              b64url(JSON.stringify({ alg: 'RS256', typ: 'JWT' })),
              b64url(JSON.stringify({ iat: now - 60, exp: now + 540, iss: APP_ID })),
            ].join('.');
            const signed = await call(`${VAULT_ADDR}/v1/transit/sign/github-promoter-app/sha2-256`, {
              method: 'POST',
              headers: { 'X-Vault-Token': VAULT_TOKEN },
              body: JSON.stringify({ input: Buffer.from(unsigned).toString('base64'), signature_algorithm: 'pkcs1v15' }),
            });
            const signature = Buffer.from(signed.data.signature.split(':')[2], 'base64').toString('base64url');
            const { token } = await call(`https://api.github.com/app/installations/${INSTALLATION_ID}/access_tokens`, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${unsigned}.${signature}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
              },
              body: JSON.stringify({ repositories: ['gitops'], permissions: { contents: 'write', pull_requests: 'write' } }),
            });
            core.setSecret(token);
            core.setOutput('token', token);

      # As in release-candidate.yml, on prod's pin, for the newest release
      # alone: a rerun of an older one never supersedes a newer one's PR.
      # gitops' main may have moved since it was checked out: the PR starts
      # from where it is now.
      - name: pin
        id: pin
        if: steps.version.outputs.release == 'true'
        working-directory: _gitops
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NEWEST: ${{ steps.version.outputs.newest }}
        run: |
          if [ "$NEWEST" != "$VERSION" ]; then
            echo "::notice::$NEWEST is released after $VERSION, and prod's PR is its own: none for $VERSION."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch -q --depth 1 origin main
          git checkout -q --detach FETCH_HEAD
          pin="apps/$APP/prod/kustomization.yaml"
          [ -f "$pin" ] || { echo "::error::gitops has no $pin."; exit 1; }
          yq() { mise exec yq -- yq "$@"; }
          for image in $IMAGES; do
            IMAGE=$image yq -e '.images[] | select(.name == strenv(IMAGE))' "$pin" > /dev/null ||
              { echo "::error file=$pin::No images entry named $image."; exit 1; }
          done
          yq -e '.configMapGenerator[] | select(.name == "release") | .literals[] | select(test("^APP_VERSION="))' "$pin" > /dev/null ||
            { echo "::error file=$pin::No APP_VERSION in the release ConfigMap."; exit 1; }
          cp "$pin" "$RUNNER_TEMP/pin.yaml"
          while read -r image digest <&3; do
            IMAGE=$image DIGEST=$digest yq -i '(.images[] | select(.name == strenv(IMAGE))) |= (.newTag = strenv(VERSION) | .digest = strenv(DIGEST))' "$RUNNER_TEMP/pin.yaml"
          done 3< "$RUNNER_TEMP/digests"
          yq -i '(.configMapGenerator[] | select(.name == "release") | .literals[] | select(test("^APP_VERSION="))) = "APP_VERSION=" + strenv(VERSION)' "$RUNNER_TEMP/pin.yaml"
          diff -B -U0 --label "$pin" --label "$pin" "$pin" "$RUNNER_TEMP/pin.yaml" > "$RUNNER_TEMP/pin.diff" || true
          if [ ! -s "$RUNNER_TEMP/pin.diff" ]; then
            echo "Prod is pinned to $VERSION already."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git apply -p0 --unidiff-zero "$RUNNER_TEMP/pin.diff"
          git diff
          {
            echo "changed=true"
            echo "path=$pin"
            echo "base=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      # As in release-candidate.yml, with no auto-merge.
      - name: promotion PR
        if: steps.pin.outputs.changed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ENVIRONMENT: prod
          VERSION: ${{ steps.version.outputs.version }}
          PIN: ${{ steps.pin.outputs.path }}
          BASE: ${{ steps.pin.outputs.base }}
          TITLE: "chore(${{ inputs.app }}): release ${{ steps.version.outputs.version }} to prod"
          LINK: ${{ steps.release.outputs.url }}
        with:
          github-token: ${{ steps.promoter.outputs.token }}
          script: |
            const fs = require('fs');
            const { APP, ENVIRONMENT, VERSION, PIN, BASE, TITLE, LINK, RUNNER_TEMP } = process.env;
            const digests = fs.readFileSync(`${RUNNER_TEMP}/digests`, 'utf8').trim().split('\n').map((line) => line.split(' '));
            const owner = context.repo.owner;
            const repo = 'gitops';
            const prefix = `chore/promote-${APP}-${ENVIRONMENT}-`;
            const branch = `${prefix}${VERSION}`;

            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'all', head: `${owner}:${branch}` });
            let pr = prs.find((p) => p.state === 'open');
            const done = prs.find((p) => p.state === 'closed');
            if (pr) {
              const { data } = await github.rest.repos.getContent({ owner, repo, path: PIN, ref: pr.head.sha });
              const pinned = Buffer.from(data.content, 'base64').toString();
              if (!digests.every(([, digest]) => pinned.includes(`digest: ${digest}`)) || !pinned.includes(`APP_VERSION=${VERSION}`)) {
                core.setFailed(`#${pr.number} is open on ${branch}, but its pin is not ${VERSION} at ${digests.map(([, digest]) => digest).join(', ')}.`);
                return;
              }
              core.info(`#${pr.number} is open already with this pin.`);
            } else if (done) {
              core.notice(`#${done.number} promoted ${VERSION} before, and is ${done.merged_at ? 'merged' : 'closed'}: not opened again.`);
              return;
            } else {
              try {
                await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: BASE });
              } catch (e) {
                if (e.status !== 422) throw e;
                await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: BASE, force: true });
              }
              await github.graphql(
                `mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }`,
                { input: {
                  branch: { repositoryNameWithOwner: `${owner}/${repo}`, branchName: branch },
                  message: { headline: TITLE },
                  expectedHeadOid: BASE,
                  fileChanges: { additions: [{ path: PIN, contents: fs.readFileSync(`_gitops/${PIN}`).toString('base64') }] },
                } },
              );
              const body = [
                `\`${APP}\` in ${ENVIRONMENT}: \`${VERSION}\`.`,
                '',
                `- Version: \`${VERSION}\``,
                ...digests.map(([image, digest]) => `- Digest: \`${digest}\`, of \`${image}\``),
                `- Release: ${LINK}`,
                '',
                'Merging it is the release to prod.',
              ].join('\n');
              pr = (await github.rest.pulls.create({ owner, repo, base: 'main', head: branch, title: TITLE, body })).data;
            }
            core.notice(`${TITLE}: ${pr.html_url}`);

            const others = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', base: 'main' });
            for (const old of others) {
              if (old.number === pr.number || old.user.login !== pr.user.login || !old.head.ref.startsWith(prefix)) continue;
              await github.rest.issues.createComment({ owner, repo, issue_number: old.number, body: `Superseded by #${pr.number}.` });
              await github.rest.pulls.update({ owner, repo, pull_number: old.number, state: 'closed' });
              await github.rest.git.deleteRef({ owner, repo, ref: `heads/${old.head.ref}` });
            }

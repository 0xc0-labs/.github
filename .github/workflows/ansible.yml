# Reusable: the Ansible playbooks a change affects, one job each: on a PR,
# lint and --check; on main, for real (README, Using the reusable workflows).
name: ansible

on:
  workflow_call:
    inputs:
      playbooks:
        description: Playbooks to run, relative to ansible-dir, one per line. Only those the change affects run, each in its own job.
        type: string
        required: true
      wrapper:
        description: Script that runs ansible-playbook with the secrets in its environment, relative to the repo root. Takes a playbook and ansible-playbook's arguments.
        type: string
        default: scripts/ansible
      max-parallel:
        description: >-
          How many playbooks run at once. A repo whose playbooks need what an
          earlier one set up passes 1: they then run in the listed order.
        type: number
        default: 10
      ansible-dir:
        description: Directory holding playbooks/ and roles/, relative to the repo root, where the wrapper runs them.
        type: string
        default: ansible
      lint:
        description: >-
          Command that runs ansible-lint in ansible-dir, at the version the
          caller pins, on a PR before any playbook runs. Empty skips it.
        type: string
        default: uv run --frozen --group lint ansible-lint --profile=production
      tofu-root:
        description: OpenTofu root to initialise first, when the wrapper reads its outputs. Empty skips it.
        type: string
        default: ""
      environment:
        description: Environment whose reviewers must approve a real run.
        type: string
        default: production
      tools:
        description: mise tools to install. Only these — a broken, unrelated tool in the repo's mise.toml must not block a run.
        type: string
        default: ansible opentofu jq uv
      runs-on:
        description: >-
          Where the jobs run, as JSON. Defaults to the self-hosted runners on
          the CI VMs, which reach every VM over SSH. A PR from a fork always
          runs on "ubuntu-latest", never on the self-hosted ones.
        type: string
        default: '{"group": "0xc0", "labels": "0xc0"}'
      vault-addr:
        description: Vault's address. Empty, the job does not log in to Vault.
        type: string
        default: ""
      vault-role:
        description: Vault JWT auth role the job logs in with, through GitHub's OIDC token. Required with vault-addr.
        type: string
        default: ""
      vault-secrets:
        description: >-
          The secrets the job reads from Vault once logged in, in
          hashicorp/vault-action's format ("<path> <key> | <ENV_VAR>;" per
          line): each lands in the job's environment, masked. Every secret
          the job needs comes from here.
        type: string
        default: ""
      ssh-key-env:
        description: The environment variable, one of vault-secrets, that holds the CI SSH private key.
        type: string
        required: true
      skip-paths:
        description: Globs added to the paths that never cause work (README, Path gates).
        type: string
        default: ''
      work-paths:
        description: Globs that always cause work, even where the central list ignores them (README, Path gates).
        type: string
        default: ''

# id-token: for the Vault login; the caller grants it even without Vault.
permissions:
  contents: read
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - id: changes
        uses: 0xc0-labs/.github/.github/actions/changes@main # nosemgrep: third-party-action-not-pinned-to-commit-sha, github-actions-mutable-action-tag - this org's own action, read from main like its reusable workflows
        with:
          skip-paths: ${{ inputs.skip-paths }}
          work-paths: ${{ inputs.work-paths }}

  # A changed playbook, or one naming a changed role; any other change runs
  # them all.
  select:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      playbooks: ${{ steps.select.outputs.playbooks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: select
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          PLAYBOOKS: ${{ inputs.playbooks }}
          ANSIBLE_DIR: ${{ inputs.ansible-dir }}
        run: |
          all=1
          if [ "$EVENT" = pull_request ]; then
            changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"; all=0
          elif [ -n "$BEFORE" ] && [ "${BEFORE//0/}" != "" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"; all=0
          fi
          mapfile -t playbooks < <(printf '%s\n' "$PLAYBOOKS" | grep -v '^$')
          declare -A hit=()
          while IFS= read -r f; do
            [ "$all" = 0 ] || break
            [ -n "$f" ] || continue
            case "$f" in
              "$ANSIBLE_DIR"/playbooks/*)
                # A playbook outside the list runs nowhere here.
                hit["${f#"$ANSIBLE_DIR"/}"]=1 ;;
              "$ANSIBLE_DIR"/roles/*/*)
                # Roles carry no meta dependencies; one that does would need
                # its dependants found here too.
                role="${f#"$ANSIBLE_DIR"/roles/}"; role="${role%%/*}"
                for p in "${playbooks[@]}"; do
                  if grep -Eq "^[[:space:]-]*(role|name):[[:space:]]*[\"']?$role[\"']?[[:space:]]*$" "$ANSIBLE_DIR/$p"; then hit["$p"]=1; fi
                done ;;
              *) all=1 ;;
            esac
          done <<< "${changed:-}"
          selected=()
          for p in "${playbooks[@]}"; do
            if [ "$all" = 1 ] || [ -n "${hit[$p]:-}" ]; then selected+=("$p"); fi
          done
          if [ "${#selected[@]}" = 0 ]; then echo "No playbook is affected by this change."; else printf 'Runs: %s\n' "${selected[@]}"; fi
          echo "playbooks=$(printf '%s\n' "${selected[@]}" | jq -Rsc 'split("\n") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"

  # The whole ansible-dir, whichever playbooks the change affects. Only on a
  # PR: what reaches main was linted on its PR.
  lint:
    needs: changes
    if: needs.changes.outputs.run == 'true' && github.event_name == 'pull_request' && inputs.lint != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: ${{ inputs.tools }}

      - name: ansible-lint
        working-directory: ${{ inputs.ansible-dir }}
        env:
          LINT: ${{ inputs.lint }}
        run: eval "$LINT"

  ansible:
    needs: [select, lint]
    # A job whose needs include a skipped one is skipped too, unless its
    # condition calls a status function; lint is skipped on a push.
    if: >-
      ${{ !cancelled() && needs.select.result == 'success'
      && (needs.lint.result == 'success' || needs.lint.result == 'skipped')
      && needs.select.outputs.playbooks != '[]' }}
    # Each playbook holds its own hosts, so a failure does not stop the others.
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix:
        playbook: ${{ fromJSON(needs.select.outputs.playbooks) }}
    # Fork PRs run on GitHub's runners, with no secrets, never in the network.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON(inputs.runs-on) }}
    # Only the real run waits for approval; the PR's dry run is the review.
    environment: ${{ github.event_name == 'push' && inputs.environment || '' }}
    # Two runs on the same VMs would race; cancelling one leaves a VM
    # half-configured.
    concurrency:
      group: ansible-${{ github.repository }}-${{ matrix.playbook }}
      cancel-in-progress: false
    env:
      PLAYBOOK: ${{ matrix.playbook }}
      WRAPPER: ${{ inputs.wrapper }}
      TOFU_ROOT: ${{ inputs.tofu-root }}
      VAULT_ADDR: ${{ inputs.vault-addr }}
      SSH_KEY_ENV: ${{ inputs.ssh-key-env }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      ANSIBLE_FORCE_COLOR: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: ${{ inputs.tools }}

      - name: vault
        if: inputs.vault-addr != ''
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ inputs.vault-addr }}
          method: jwt
          path: jwt
          role: ${{ inputs.vault-role }}
          jwtGithubAudience: ${{ inputs.vault-addr }}
          exportToken: true
          secrets: ${{ inputs.vault-secrets }}

      # RUNNER_TEMP, not $HOME: on a self-hosted runner, $HOME outlives the job.
      - name: ssh
        run: |
          ssh_key="$RUNNER_TEMP/ssh-key"
          ( umask 077 && printf '%s\n' "${!SSH_KEY_ENV}" > "$ssh_key" )
          echo "SSH_KEY_FILE=$ssh_key" >> "$GITHUB_ENV"
          # Fresh host keys per job: a VM rebuilt at the same address gets a new
          # one, which a kept known_hosts would refuse.
          echo "KNOWN_HOSTS=$RUNNER_TEMP/known_hosts" >> "$GITHUB_ENV"

      - name: init
        if: inputs.tofu-root != ''
        run: tofu -chdir="$TOFU_ROOT" init -no-color

      - name: playbook
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then mode=(--diff); else mode=(--check --diff); fi
          echo "$PLAYBOOK ${mode[*]}"
          "$WRAPPER" "$PLAYBOOK" "${mode[@]}"

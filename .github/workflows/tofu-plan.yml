# Reusable: fmt, validate and plan an OpenTofu root, and post the plan on the PR.
# A PR touching no file it cares about skips the job, which counts as passed,
# so its check can be required (README, Path gates).
name: tofu-plan

on:
  workflow_call:
    inputs:
      working-directory:
        description: OpenTofu root to plan, relative to the repo root.
        type: string
        required: true
      paths:
        description: Extended regex over changed file paths. A PR touching none of them skips the plan.
        type: string
        default: '^(environments/|modules/|mise\.toml$)'
      skip-paths:
        description: Globs added to the paths that never cause a plan (README, Path gates).
        type: string
        default: ''
      work-paths:
        description: Globs that always cause a plan, even where the central list ignores them (README, Path gates).
        type: string
        default: ''
      tools:
        description: mise tools to install. Only these — a broken, unrelated tool in the repo's mise.toml must not block a plan or an apply.
        type: string
        default: opentofu
      runs-on:
        description: >-
          Where the job runs, as JSON. Defaults to the self-hosted runners on
          the CI VMs, inside the network. A PR from a fork always runs on
          "ubuntu-latest", never on the self-hosted ones.
        type: string
        default: '{"group": "0xc0", "labels": "0xc0"}'
      vault-addr:
        description: Vault's address, for a root whose provider talks to Vault. Empty, the job does not log in to Vault.
        type: string
        default: ""
      vault-role:
        description: Vault JWT auth role the job logs in with, through GitHub's OIDC token. Required with vault-addr.
        type: string
        default: ""
      vault-secrets:
        description: >-
          The secrets the job reads from Vault once logged in, in
          hashicorp/vault-action's format ("<path> <key> | <ENV_VAR>;" per
          line): each lands in the job's environment, masked. Every secret
          the job needs comes from here.
        type: string
        default: ""

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - id: changes
        uses: 0xc0-labs/.github/.github/actions/changes@main
        with:
          paths-regex: ${{ inputs.paths }}
          skip-paths: ${{ inputs.skip-paths }}
          work-paths: ${{ inputs.work-paths }}

  tofu:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # Fork PRs run on GitHub's runners, with no secrets, never in the network.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON(inputs.runs-on) }}
    # id-token: for the Vault login; the caller grants it even without Vault.
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    # Killing tofu mid-run can leave the lock behind: README, Concurrency.
    concurrency:
      group: tofu-plan-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.working-directory }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_CLI_ARGS_plan: "-lock-timeout=5m"
      ROOT: ${{ inputs.working-directory }}
      VAULT_ADDR: ${{ inputs.vault-addr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: ${{ inputs.tools }}

      - name: vault
        if: inputs.vault-addr != ''
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ inputs.vault-addr }}
          method: jwt
          path: jwt
          role: ${{ inputs.vault-role }}
          jwtGithubAudience: ${{ inputs.vault-addr }}
          exportToken: true
          secrets: ${{ inputs.vault-secrets }}

      - name: fmt
        run: tofu fmt -check -recursive -no-color

      - name: init
        run: |
          tofu -chdir="$ROOT" init -no-color

      - name: validate
        run: tofu -chdir="$ROOT" validate -no-color

      - name: plan
        run: |
          tofu -chdir="$ROOT" plan -no-color -out=tfplan
          tofu -chdir="$ROOT" show -no-color tfplan > plan.txt

      - name: comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const root = process.env.ROOT;
            const marker = `<!-- tofu-plan:${root} -->`;
            let plan = fs.readFileSync('plan.txt', 'utf8');
            const limit = 60000;
            if (plan.length > limit) {
              plan = plan.slice(0, limit) + '\n\n… truncated, see the job log.';
            }
            const body = `${marker}\n### tofu plan — \`${root}\`\n\n\`\`\`\n${plan}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

# Reusable: one PR comment with the coverage report that node-check, run with
# `coverage: true`, uploaded as an artifact of the same run (README,
# Application repos). A job of its own, so only a caller that asks for
# coverage grants `pull-requests: write`.
name: coverage-comment

on:
  workflow_call:
    inputs:
      working-directory:
        description: >-
          The same working-directory the caller gave node-check: it tells apart
          the comments of two apps in one repo.
        type: string
        default: .

permissions:
  contents: read

jobs:
  comment:
    # A fork's token is read-only: its PR gets node-check's job summary alone.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || (github.event.repository.private && fromJSON('{"group": "0xc0", "labels": "0xc0"}') || 'ubuntu-latest') }}
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 5
    steps:
      # Missing when the tests produced no summary: nothing to say then.
      - id: report
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          path: ${{ runner.temp }}/coverage-report

      - if: steps.report.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_FILE: ${{ runner.temp }}/coverage-report/report.md
          MARKER: '<!-- node-check-coverage:${{ inputs.working-directory }} -->'
        with:
          script: |
            const { readFileSync } = require('node:fs')
            const body = `${process.env.MARKER}\n${readFileSync(process.env.REPORT_FILE, 'utf8')}`
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const existing = comments.find((c) => c.body?.startsWith(process.env.MARKER))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

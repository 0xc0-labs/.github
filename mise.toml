# Tooling for the .github (organization Terraform) repo.
[tools]
opentofu = "1.12.6"
gh       = "2.101.0"
jq       = "1.8.2"
# The Vault CLI, the server's version: scripts/tofu reads the secrets with it.
vault    = "2.0.4"
actionlint = "1.7.12"
terraform-docs = "0.24.0"

[tasks.docs]
description = "Regenerate the inputs/outputs section of every module README"
run = 'for m in modules/*/; do terraform-docs markdown table --output-file README.md --output-mode inject "$m"; done'

[settings]
# Installs only what mise.lock records, every download checked against its
# checksum, for this machine's platform. After any change above, `mise lock`.
locked = true
